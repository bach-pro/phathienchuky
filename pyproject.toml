[project]
name = "signature-detector"
version = "0.1.0"
description = "A signature detection model using YOLO26."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "ultralytics>=8.4.0",
    "numpy>=1.25.0",
    "opencv-python>=4.9.0",    
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
